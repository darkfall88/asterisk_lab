; ========================================
; ASTERISK 2 - DIALPLAN
; ========================================

[general]
static=yes
writeprotect=no

[globals]

[from-phones]

; Samsung S24 - lokalni SIP ucet
exten => 2001,1,Dial(PJSIP/2001,30)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Hovory 1XXX pres trunk na Asterisk 1
exten => _1XXX,1,Dial(PJSIP/${EXTEN}@trunk-a1,30)
 same => n,Hangup()

; ========================================
; INCOMING CALLS FROM ASTERISK 1
; ========================================

[from-a1]

exten => 2001,1,Dial(PJSIP/2001,30)
 same => n,Hangup()