[general]
static=yes
writeprotect=no

[globals]

; ========================================
; SIP CLIENTS - ASTERISK 1
; ========================================

[from-phones]

; Xiaomi 15 - lokalni SIP ucet
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Hovory 2XXX pres trunk na Asterisk 2
exten => _2XXX,1,Dial(PJSIP/${EXTEN}@trunk-a2,30)
 same => n,Hangup()

; ========================================
; INCOMING CALLS FROM ASTERISK 2
; ========================================

[from-a2]

exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()